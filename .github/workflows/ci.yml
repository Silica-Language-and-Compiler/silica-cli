# Lint and test the silica CLI on every push and pull request. Every push to main (a merged
# pull request, or a commit pushed straight to main) that passes the tests is published as a
# GitHub release.
#
# Versions: a push to main releases the newest vX.Y.Z tag with its patch number bumped
# (v0.1.0 when there is none yet). To move the minor or major number, push a tag such as
# v0.2.0 yourself; that tag is released as is, and the next merge continues from it (v0.2.1).
#
#   lint     bash -n and shellcheck over every script
#   test     tests/run.sh on each platform a Silica compiler is released for, using the
#            latest compiler from Silica-Language-and-Compiler/silica (downloaded by the CLI)
#   release  publishes silica-cli.tar.gz (+ .sha256) and install.sh as release assets
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check syntax
        run: |
          for f in silica src/silica.sh install.sh tests/run.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        # shellcheck is preinstalled on GitHub's Ubuntu runners.
        run: shellcheck --severity=warning silica src/silica.sh install.sh tests/run.sh

  test:
    name: Test (${{ matrix.platform }})
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-applesilicon
            runner: macos-26
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: linux-x86_64
            runner: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}  # raises the GitHub API rate limit for the compiler lookup
    steps:
      - uses: actions/checkout@v5

      - name: Use a private SILICA_HOME
        # The runner context is not available in job-level env, so set it here.
        run: echo "SILICA_HOME=${RUNNER_TEMP}/silica-home" >> "${GITHUB_ENV}"

      - name: Install
        run: ./install.sh

      - name: Show versions
        run: ./silica version

      - name: Run tests
        run: tests/run.sh

  release:
    name: Release
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # all tags, to find the latest version

      - name: Choose the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            latest="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [ -z "${latest}" ]; then
              tag="v0.1.0"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${tag} already exists" >&2
            exit 1
          fi
          echo "Releasing ${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package
        # Asset names carry no version, so releases/latest/download/<asset> always resolves;
        # install.sh relies on that. The tag is stamped into src/silica.sh instead.
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          stage="dist/silica-cli"
          mkdir -p "${stage}"
          cp -R silica install.sh README.md src examples "${stage}/"
          sed -i "s/^SILICA_CLI_VERSION=\"dev\"\$/SILICA_CLI_VERSION=\"${tag}\"/" "${stage}/src/silica.sh"
          grep -q "^SILICA_CLI_VERSION=\"${tag}\"\$" "${stage}/src/silica.sh" \
            || { echo "could not stamp the version into src/silica.sh" >&2; exit 1; }
          tar -C dist -czf dist/silica-cli.tar.gz silica-cli
          (cd dist && sha256sum silica-cli.tar.gz > silica-cli.tar.gz.sha256)
          cp install.sh dist/install.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          notes="$(mktemp)"
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | bash"
            echo '```'
            echo
            echo "This version only:"
            echo
            echo '```bash'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/install.sh | SILICA_CLI_VERSION=${tag} bash"
            echo '```'
          } > "${notes}"
          prerelease=()
          case "${tag}" in *-*) prerelease=(--prerelease) ;; esac
          # On main this creates the tag at the commit that was tested. A tag made with
          # GITHUB_TOKEN does not trigger another workflow run.
          gh release create "${tag}" \
            dist/silica-cli.tar.gz \
            dist/silica-cli.tar.gz.sha256 \
            dist/install.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "silica-cli ${tag}" \
            --notes-file "${notes}" \
            --generate-notes \
            "${prerelease[@]}"
